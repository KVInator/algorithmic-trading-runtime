name: Native build acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise Windows checkout newline conversion
        if: runner.os == 'Windows'
        run: git -c core.autocrlf=true checkout-index --all --force
      - name: Build native Visual Studio solution
        if: runner.os == 'Windows'
        run: |
          $finder = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $install = & $finder -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$install/MSBuild/Current/Bin/MSBuild.exe" Runtime.sln /m /p:Configuration=Release /p:Platform=x64
          exit $LASTEXITCODE
      - name: Build native Linux applications
        if: runner.os == 'Linux'
        run: python -B build.py --configuration Release --jobs 2
      - name: Run saved-event demonstration and independent reference
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          suffix = '.exe' if sys.platform == 'win32' else ''
          subprocess.run([str(Path('scratch/native/Release/project_demo' + suffix).resolve())], check=True)
          subprocess.run([sys.executable, '-B', 'research/verify_project_demo.py', 'scratch/runs/project_demo_0'], check=True)
      - name: Run execution measurements and benchmark with independent references
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          suffix = '.exe' if sys.platform == 'win32' else ''
          for name in ('execution_measurement', 'runtime_benchmark'):
              subprocess.run([str(Path('scratch/native/Release/' + name + suffix).resolve())], check=True)
              subprocess.run([sys.executable, '-B', 'research/verify_' + name + '.py', 'scratch/runs/' + name + '_0'], check=True)
      - name: Verify distributed publication after checkout conversion
        run: python -B research/verify_publication.py
      - name: Build native Debug solution
        if: runner.os == 'Windows'
        run: |
          $finder = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $install = & $finder -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$install/MSBuild/Current/Bin/MSBuild.exe" Runtime.sln /m /p:Configuration=Debug /p:Platform=x64
          exit $LASTEXITCODE
      - name: Verify Debug demonstration
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess, sys
          subprocess.run(['scratch/native/Debug/project_demo.exe'], check=True)
          subprocess.run([sys.executable, '-B', 'research/verify_project_demo.py', 'scratch/runs/project_demo_1'], check=True)
