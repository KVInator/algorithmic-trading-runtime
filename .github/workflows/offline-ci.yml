name: Offline C++ verification
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publication and curated evidence
        run: python -B research/verify_publication.py
      - name: Configure Release
        run: cmake -S . -B scratch/ci-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build scratch/ci-build --config Release --parallel 2
      - name: Offline routine contracts
        run: ctest --test-dir scratch/ci-build -C Release -LE integration --output-on-failure
      - name: Independently verify benchmark contract artifacts
        run: python -B research/verify_runtime_benchmark.py scratch/ci-build/runtime_benchmark_tests-output/runtime-benchmark_0
      - name: Constructed demo and independent verifier (Linux)
        if: runner.os == 'Linux'
        run: |
          scratch/ci-build/project_demo
          python -B research/verify_project_demo.py scratch/runs/project_demo_0
      - name: Constructed demo and independent verifier (Windows)
        if: runner.os == 'Windows'
        run: |
          & scratch/ci-build/Release/project_demo.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/verify_project_demo.py scratch/runs/project_demo_0
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-logs-${{ matrix.os }}
          path: scratch/ci-build/Testing/Temporary/
          retention-days: 3
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B scratch/ci-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build execution contracts
        run: cmake --build scratch/ci-asan --parallel 2 --target project_demo strategy_execution_tests runtime_benchmark_tests execution_measurement_tests paper_broker_tests paper_execution_tests order_runtime_tests journaled_runtime_tests
      - name: Sanitized execution and recovery checks
        run: ctest --test-dir scratch/ci-asan -R '(strategy_execution|runtime_benchmark|execution_measurement|paper_broker|paper_execution|order_runtime|journaled_runtime)_contracts' --output-on-failure
      - name: Sanitized complete demo
        run: scratch/ci-asan/project_demo
